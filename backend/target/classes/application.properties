# =======================================================
# AirShare: Spring Boot Application Configuration
# =======================================================

# Server Port (using 8085 to avoid Apache/PEM httpd conflict on 8080)
server.port=8085

# PostgreSQL 16 + PostGIS Connection (PostgreSQL 16 is on port 5434)
spring.datasource.url=jdbc:postgresql://localhost:5434/airshare_db
spring.datasource.username=postgres
spring.datasource.password=Deekshithbn@123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.ewit.airshare=INFO
